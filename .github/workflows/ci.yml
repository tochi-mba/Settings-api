name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types
        run: uv run mypy
      - name: Architecture contracts
        run: uv run lint-imports

  generated:
    name: Generated files are in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --group dev
      # The schema snapshot and the catalogue page are generated, and a stale one is
      # invisible in review -- nobody diffs prose against code. Regenerating them here and
      # failing on a diff is what makes "run make schema and commit it" enforceable.
      - name: Schema snapshot
        run: |
          uv run python scripts/dump_schema.py
          git diff --exit-code -- src/settings_api/storage/schema.sql
      - name: Catalogue documentation
        run: |
          uv run python scripts/gen_catalogue.py
          git diff --exit-code -- docs/catalogue.md

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --group dev
      - name: Tests with 100% branch coverage enforced
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
