[project]
name = "settings-api"
version = "0.1.0"
description = "One place a person decides how every service in the family behaves for them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tochi-mba" }]
keywords = ["fastapi", "settings", "mcp", "personal-data", "privacy"]
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring-client",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
settings-api = "settings_api.__main__:main"

[project.urls]
Repository = "https://github.com/tochi-mba/Settings-api"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "cryptography>=43.0",
    "hypothesis>=6.112",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settings_api"]

# --------------------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "clients/python"]

[tool.ruff.lint]
select = [
    "A",      # builtin shadowing
    "ANN",    # missing annotations
    "ARG",    # unused arguments
    "ASYNC",  # async correctness
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # naive datetimes
    "E",      # pycodestyle errors
    "EM",     # exception message hygiene
    "ERA",    # commented-out code
    "F",      # pyflakes
    "FA",     # future annotations
    "I",      # import sorting
    "ICN",    # import conventions
    "N",      # pep8-naming
    "PERF",   # performance anti-patterns
    "PIE",
    "PL",     # pylint subset
    "PT",     # pytest style
    "PTH",    # use pathlib
    "RET",    # return hygiene
    "RSE",
    "RUF",
    "S",      # bandit
    "SIM",    # simplify
    "SLF",    # private member access
    "T20",    # no print
    "TC",     # typing-only imports
    "TID",    # tidy imports
    "TRY",    # exception hygiene
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation
    "TRY003",  # long messages inline beat an exception subclass per message
]

[tool.ruff.lint.per-file-ignores]
# FastAPI resolves handler annotations at runtime to build the dependency graph and the
# OpenAPI schema, so its type-only-looking imports must stay importable at runtime.
"src/settings_api/api/routers/*" = [
    "TC001",
    "TC002",
    "TC003",
    # A handler's parameters ARE its HTTP contract: each one is a path segment, a query
    # parameter, a header or a dependency, and FastAPI reads them to build the route.
    # Grouping them into an object would change the API rather than tidy the code.
    "PLR0913",
    "PLR0917",
]
"src/settings_api/api/dependencies.py" = ["TC001", "TC002", "TC003"]
# Pydantic resolves model field annotations at runtime to build validators and the
# JSON schema, so the types they name must be imported at runtime too.
"src/settings_api/api/schemas/*" = ["TC001", "TC002", "TC003"]
# The catalogue is a table. Thirty entries with a paragraph each is a long module by
# construction, and splitting one namespace across two files to satisfy a line count
# would make it harder to read rather than easier.
"src/settings_api/domain/catalogue/*" = ["E501"]
# These are read at a call site as `except SettingsUnavailable:` and `except
# SettingsRefused:`, where the suffix adds a syllable and no information. The base class
# is `SettingsClientError`, so the family is still findable.
"clients/python/settings_client/errors.py" = ["N818"]
# A fake exists to be substitutable for the real thing, so it mirrors the real
# signatures exactly -- unused parameters, timeout arguments and all.
"tests/fakes/*" = ["ARG002", "ASYNC109"]
# Same reason, one directory over: FakeSettingsClient exists to be substitutable for
# HttpSettingsClient, so it takes `user_token` whether or not an in-memory fake needs one.
"clients/python/settings_client/testing.py" = ["ARG002"]
# An operational script, not library code: it prints (that is its output), it exits
# non-zero (that is its contract), and it talks to a real server over real HTTP.
"scripts/*" = ["T20", "S310", "PLR0915", "PLR0912", "PLR2004"]
"tests/**" = [
    # A parametrised case supplies every name in the tuple, and a test asserting about
    # one of them is not wrong for ignoring the other; a fixture requested purely for the
    # state it sets up is not wrong either. The rule stays on for src/, where an unused
    # argument means a signature nobody updated.
    "ARG001",
    "ARG002",
    "S101",    # asserts are the point
    "S105",    # test fixtures contain literal token-shaped strings on purpose
    "S106",
    "S107",
    "SLF001",  # tests may inspect private state
    "PLR2004", # magic numbers are fine in assertions
    "PLR0913", # helpers mirroring a wide API legitimately take many arguments
    "TC001",   # fixtures are annotated with the types they are, not deferred strings
    "TC002",
    "TC003",
    "PLC0415", # a local import inside one test keeps its setup next to its assertion
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["settings_api", "settings_client"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "clients/python"]
mypy_path = "clients/python"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --------------------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The client is a separate distribution that lives in this repository; the suite runs
# the real one against the real app, so it has to be importable without an install.
pythonpath = ["clients/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["settings_api", "settings_client"]
branch = true
parallel = false

[tool.coverage.paths]
source = [
    "src/settings_api",
    "*/site-packages/settings_api",
    "clients/python/settings_client",
    "*/site-packages/settings_client",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
# Only non-executable lines are excluded. Nothing that contains real logic is
# excluded, and `# pragma: no cover` is not used anywhere in src/. See AGENTS.md.
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "^\\s*if TYPE_CHECKING:",
    "^\\s*@(?:typing\\.)?overload$",
    "^\\s*raise NotImplementedError$",
    "^\\s*if __name__ == .__main__.:$",
]

# --------------------------------------------------------------------------------------
# Architecture (layering is enforced, not merely documented)
# --------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "settings_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "settings_api.api",
    "settings_api.settings",
    "settings_api.events",
    "settings_api.auth",
    "settings_api.storage",
    "settings_api.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["settings_api.domain"]
forbidden_modules = [
    "settings_api.api",
    "settings_api.auth",
    "settings_api.core",
    "settings_api.events",
    "settings_api.settings",
    "settings_api.storage",
]

[[tool.importlinter.contracts]]
name = "SQL stays behind the stores"
type = "forbidden"
source_modules = ["settings_api.api", "settings_api.auth", "settings_api.domain"]
forbidden_modules = ["settings_api.storage", "sqlite3"]
allow_indirect_imports = true

# Everything this service asks of keyring -- and every rule by which it believes an
# answer -- lives in one package that can be read in a sitting. Nothing else speaks JWT,
# and nothing else makes an outbound HTTP call, so "how do we decide who this is" has
# exactly one place to look. It is also why JwksClient.key_for is annotated `-> Any`
# rather than `-> jwt.PyJWK`: a signature naming a library's type is how that library
# leaks out of the package meant to hold it.
[[tool.importlinter.contracts]]
name = "Outbound HTTP and JWT live in one package"
type = "forbidden"
source_modules = [
    "settings_api.api",
    "settings_api.domain",
    "settings_api.events",
    "settings_api.settings",
    "settings_api.storage",
]
forbidden_modules = ["httpx", "jwt", "keyring_client"]
allow_indirect_imports = true

# The catalogue is a table, and a table is reviewable. A catalogue module that could
# import the store is a catalogue entry that could have behaviour, and then thirty
# settings stop being something a person can read in one sitting and check. It may
# import the shape of a setting and nothing else -- not the errors, not the value
# helpers, and certainly not a database.
[[tool.importlinter.contracts]]
name = "The catalogue is data"
type = "forbidden"
source_modules = ["settings_api.domain.catalogue"]
forbidden_modules = [
    "settings_api.api",
    "settings_api.auth",
    "settings_api.core",
    "settings_api.events",
    "settings_api.settings",
    "settings_api.storage",
    "settings_api.domain.errors",
    "settings_api.domain.namespaces",
    "settings_api.domain.policy",
    "settings_api.domain.registry",
    "settings_api.domain.resolution",
    "settings_api.domain.secrets",
    "settings_api.domain.values",
]

[tool.uv.sources]
keyring-client = { git = "https://github.com/tochi-mba/Keyring-api", subdirectory = "clients/python", tag = "keyring-client-v0.1.0" }
